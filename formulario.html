<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Federación de Bomberos</title>
    <link rel="stylesheet" href="style.css">

    <!-- TIPOGRAFÍA -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap"
        rel="stylesheet">
</head>

<body>

    <header class="navbar">

    <div class="logo">
        <a href="index.html">
            <img src="iconos/Recurso 20.png" alt="logo_federación">
        </a>
    </div>

    <nav class="nav">
        <ul>
            <li><a href="index.html">Volver al inicio</a></li>
        </ul>
    </nav>

    </header>

    <main>
<section class="inscripcion">

    <header>

        <h2>FORMULARIO DE INSCRIPCIÓN</h2>

        <p>
            Completá los siguientes datos para iniciar tu proceso de inscripción
            como Bombero Voluntario.
        </p>

    </header>

    <form>

        <label for="nombre">Nombre y Apellido</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="edad">Edad</label>
        <input type="number" id="edad" name="edad" min="18" required>

        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" name="email" required>

        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" name="telefono" required>

        <label for="localidad">Localidad</label>
        <input type="text" id="localidad" name="localidad" required>

        <label for="direccion">Dirección</label>
        <input type="text" id="direccion" name="direccion">

        <label for="motivo">
            ¿Por qué querés formar parte de la Federación?
        </label>

        <textarea
            id="motivo"
            name="motivo"
            rows="6"
            required>
        </textarea>

        <button type="submit">
            Enviar Solicitud
        </button>

    </form>

</section>
        
    </main>

    <footer>

        <section class="footer-redes">

            <h3>Nuestras redes</h3>

            <ul>
                <li><img src="img/facebook.png" alt=""><a href="#"></a></li>
                <li><img src="img/linkedin.png" alt=""><a href="#"></a></li>
                <li><img src="img/icono-ig.png" alt=""><a href="#"></a></li>
            </ul>

        </section>

        <section class="footer-contacto">

            <img src="img/" alt="">

            <h3>Números de contacto</h3>

            <p>011 2234-5555</p>



        </section>

        <section class="footer-preguntas">

            <h3>Preguntas frecuentes</h3>

            <a href="#">Hacé click aquí y descubri más</a>

        </section>

    </footer>

    <script src="slider.js"></script>

</body>

</html>
